name: nas-manager

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: nas-manager:dev
    container_name: nas-app
    hostname: nas
    privileged: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${SHARE_HOST_PATH}:${SHARE_MOUNT_PATH}
      - ./app:/app/app
      - ./data:/data
      - samba-state:/var/lib/samba
    ports:
      # Web UI / API. Not used for mounting shares.
      - "8000:8000"
      # SMB (cifs/net use): shares are served by smbd INSIDE the container.
      # Published on ${NAS_PORT:-1445} so it doesn't clash with a host samba
      # that already owns 445/139 on the NAS machine.
      - "${NAS_PORT:-1445}:445"
    networks:
      nas:
        aliases:
          - nas

volumes:
  samba-state:

networks:
  nas:
    name: nas
